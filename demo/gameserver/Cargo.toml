[package]
name = "gameserver"
version = "0.1.0"
edition = "2024"

[dependencies]
wit-bindgen-rt = { version = "0.41.0", features = ["bitflags"] }
wstd = "0.6"
wit-bindgen = "0.48.0"
wasip2 = "=1.0.1+wasi-0.2.8"
bevy_ecs = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde", "alloc"] }
